name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinicfly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clinicfly"
           --health-interval 10s
           --health-timeout 5s
           --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run api tests
        run: npm run test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/clinicfly

      - name: Build application
        run: npm run build
